name: Plugin source checks
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run pack:workspace --dry-run
